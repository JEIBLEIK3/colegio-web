<h2 mat-dialog-title>{{ esEdicion ? 'Editar profesor' : 'Nuevo profesor' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombres</mat-label>
      <input matInput formControlName="nombres" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellidos</mat-label>
      <input matInput formControlName="apellidos" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Documento</mat-label>
      <input matInput formControlName="documento" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Correo institucional</mat-label>
      <input matInput formControlName="correo" type="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Especialidad</mat-label>
      <input matInput formControlName="especialidad" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de ingreso</mat-label>
      <input matInput type="date" formControlName="fechaIngreso" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Asignaturas (separadas por coma)</mat-label>
      <input matInput formControlName="asignaturasTexto" placeholder="Matemáticas, Geometría" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Cursos asignados</mat-label>
      <mat-select formControlName="cursosAsignados" multiple>
        @for (curso of data.cursos; track curso.id) {
          <mat-option [value]="curso.id">{{ curso.nombre }} - {{ curso.grado }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-slide-toggle formControlName="activo" class="span-2">Profesor activo</mat-slide-toggle>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
