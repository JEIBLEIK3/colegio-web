<h2 mat-dialog-title>Nueva nota · {{ data.estudianteNombre }}</h2>
<p class="dialog-subtitle">{{ data.asignatura }} · Periodo {{ data.periodo }}</p>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion" placeholder="Taller 1, Examen final, etc." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor (0.0 - 5.0)</mat-label>
      <input matInput type="number" step="0.1" min="0" max="5" formControlName="valor" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Porcentaje (%)</mat-label>
      <input matInput type="number" min="1" max="100" formControlName="porcentaje" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
