<h2 mat-dialog-title>Nuevo cobro</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Estudiante</mat-label>
      <mat-select formControlName="estudianteId">
        @for (e of data.estudiantes; track e.id) {
          <mat-option [value]="e.id">{{ e.nombres }} {{ e.apellidos }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Concepto</mat-label>
      <input matInput formControlName="concepto" placeholder="Pensión Marzo, Matrícula 2026..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Periodo (AAAA-MM)</mat-label>
      <input matInput type="month" formControlName="periodo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Monto (COP)</mat-label>
      <input matInput type="number" min="1" formControlName="monto" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Fecha de vencimiento</mat-label>
      <input matInput type="date" formControlName="fechaVencimiento" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
