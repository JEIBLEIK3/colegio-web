<h2 mat-dialog-title>Nueva observación</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Estudiante</mat-label>
      <mat-select formControlName="estudianteId">
        @for (e of data.estudiantes; track e.id) {
          <mat-option [value]="e.id">{{ e.nombres }} {{ e.apellidos }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        <mat-option value="Positiva">Positiva</mat-option>
        <mat-option value="Negativa">Negativa</mat-option>
        <mat-option value="Neutra">Neutra</mat-option>
        <mat-option value="Convivencial">Convivencial</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Compromiso (opcional)</mat-label>
      <input matInput formControlName="compromiso" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
